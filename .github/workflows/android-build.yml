name: ZENTRO Android Build

on:
  workflow_dispatch:
  push:
    branches: [android-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZENTRO Android - Latest
          body: |
            ZENTRO Android install package.
            This is an early testing build. Download zentro-android.apk and install it on an Android device.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          overwrite_files: true
