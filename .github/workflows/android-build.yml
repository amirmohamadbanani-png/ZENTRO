name: ZENTRO Android Build

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zentro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build release Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload unsigned AAB (requires signing before Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: zentro-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
